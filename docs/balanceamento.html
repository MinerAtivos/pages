<div class="iframe-wrapper">
    <iframe src="https://minerativos2.github.io/balanceamento/index.html"
            allowfullscreen
            style="width: 100%; height: 100%; border: none;">
    </iframe>

<style>
    /* Ajustes globais para garantir que o iframe ocupe toda a tela no mobile */
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden; /* Evita rolagem dupla no pai */
    }

    .container {
        padding: 0;
        margin: 0;
        max-width: 100%;
        height: 100%;
    }

    .iframe-wrapper {
        position: relative;
        width: 100%;
        height: 100vh; /* Ocupa a altura total da viewport */
        overflow-y: auto; /* Permite a rolagem interna */
        -webkit-overflow-scrolling: touch; /* Rolagem suave no iOS */
    }

    .iframe-wrapper iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: none;
    }
</style>
